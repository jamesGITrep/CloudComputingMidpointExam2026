version: '3.8'

services:
  user-service:
    build:
      context: ./user-auth-service
    ports:
      - "8000:8000"
    environment:
      - DB_USER=${USER_DB_USER:-postgres}
      - DB_PASSWORD=${USER_DB_PASSWORD:-postgres}
      - DB_NAME=${USER_DB_NAME:-user_auth_db}
      - DB_HOST=user-db
    depends_on:
      - user-db
    networks:
      - user-network

  user-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${USER_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${USER_DB_NAME:-user_auth_db}
    ports:
      - "5432:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks:
      - user-network

networks:
  user-network:
    driver: bridge

volumes:
  user-db-data:
